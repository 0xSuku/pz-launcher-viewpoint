name: release

# Publica un release cuando empujas una etiqueta vX.Y.Z (p. ej. git tag v1.0.0).
#
# Linux y macOS usan el launcher de consola (zenity), que se compila cruzado
# desde Linux. Windows usa la GUI de Wails, que NO se puede compilar cruzada
# (necesita su toolchain nativo), así que se construye en un runner de Windows.
#
# Jobs:
#   vars        — calcula versión y URLs una sola vez.
#   console     — compila los 4 binarios de consola (win/linux/mac) + payload.
#   gui-windows — compila la GUI de Wails para Windows (windows-latest).
#   release     — junta todo, genera el manifest.json con los hashes y publica.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Para la atestación de procedencia (ver job release): GitHub firma que cada
  # binario salió de este workflow, en este repo y en este commit.
  id-token: write
  attestations: write

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      release_url: ${{ steps.vars.outputs.release_url }}
      manifest_url: ${{ steps.vars.outputs.manifest_url }}
    steps:
      - name: Variables
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" >> "$GITHUB_OUTPUT"

  console:
    needs: vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Compilar binarios de consola (Linux/macOS/Windows)
        env:
          VERSION: ${{ needs.vars.outputs.version }}
          MANIFEST_URL: ${{ needs.vars.outputs.manifest_url }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.manifestURL=${MANIFEST_URL}"
          build() {
            # Linux/macOS usan el launcher de consola (zenity). Windows ya NO: su
            # única build es la GUI de Wails (job gui-windows); la clave de manifest
            # windows/amd64 apunta a la GUI para migrar a los usuarios del viejo exe
            # de consola (ver job release).
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "$LDFLAGS" -o "dist/$3" ./cmd/launcher
          }
          build linux   amd64 pzlauncher-linux-amd64
          build darwin  amd64 pzlauncher-darwin-amd64
          build darwin  arm64 pzlauncher-darwin-arm64

      - name: Copiar payload del juego
        # Deja aquí los ficheros que quieras distribuir (p. ej. projectzomboid.jar).
        run: |
          if [ -d payload ]; then cp -v payload/* dist/ || true; fi

      - name: Subir binarios de consola
        uses: actions/upload-artifact@v4
        with:
          name: console
          path: dist/
          if-no-files-found: error

  gui-windows:
    needs: vars
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Instalar Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Compilar la GUI de Wails (Windows)
        shell: bash
        env:
          VERSION: ${{ needs.vars.outputs.version }}
          MANIFEST_URL: ${{ needs.vars.outputs.manifest_url }}
        working-directory: gui
        run: |
          # -s: no reconstruir el frontend (dist/ ya está versionado en el repo).
          # Los -ldflags inyectan versión y URL igual que en el binario de consola.
          wails build -s -trimpath \
            -ldflags "-X main.version=${VERSION} -X main.manifestURL=${MANIFEST_URL}" \
            -o pzlauncher-windows-amd64-gui.exe
          ls -la build/bin

      - name: Subir la GUI de Windows
        uses: actions/upload-artifact@v4
        with:
          name: gui
          path: gui/build/bin/pzlauncher-windows-amd64-gui.exe
          if-no-files-found: error

  release:
    needs: [vars, console, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Descargar binarios de consola
        uses: actions/download-artifact@v4
        with:
          name: console
          path: dist

      - name: Descargar la GUI de Windows
        uses: actions/download-artifact@v4
        with:
          name: gui
          path: dist

      - name: Generar manifest.json
        run: |
          ARGS=()
          [ -f dist/projectzomboid.jar ] && ARGS+=(-game "projectzomboid.jar=dist/projectzomboid.jar")
          [ -f patchnotes.json ] && ARGS+=(-notes patchnotes.json)
          go run ./tools/genmanifest \
            -release-url "${{ needs.vars.outputs.release_url }}" \
            -version "${{ needs.vars.outputs.version }}" \
            "${ARGS[@]}" \
            -bin windows/amd64=dist/pzlauncher-windows-amd64-gui.exe \
            -bin windows/amd64-gui=dist/pzlauncher-windows-amd64-gui.exe \
            -bin linux/amd64=dist/pzlauncher-linux-amd64 \
            -bin darwin/amd64=dist/pzlauncher-darwin-amd64 \
            -bin darwin/arm64=dist/pzlauncher-darwin-arm64 \
            -out dist/manifest.json
          cat dist/manifest.json

      - name: Calcular huellas SHA-256
        working-directory: dist
        run: |
          # SHA256SUMS.txt: una línea "<hash>  <fichero>" por cada fichero publicado.
          ls pzlauncher-* manifest.json projectzomboid.jar 2>/dev/null | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Atestación de procedencia (firmada por GitHub)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/pzlauncher-*
            dist/manifest.json
            dist/projectzomboid.jar

      - name: Texto del release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "Compilado automáticamente por GitHub Actions desde el commit \`${SHA}\`."
            echo ""
            echo "**Windows:** descargá \`pzlauncher-windows-amd64-gui.exe\`."
            echo ""
            echo "### Comprobar que el archivo es el original"
            echo ""
            echo "En PowerShell, en la carpeta donde lo descargaste:"
            echo ""
            echo '```powershell'
            echo 'Get-FileHash .\pzlauncher-windows-amd64-gui.exe'
            echo '```'
            echo ""
            echo "El valor de **Hash** tiene que ser **exactamente igual** al de esta lista (mayúsculas o minúsculas da igual):"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Prueba de que lo compiló GitHub (no una persona): https://github.com/${REPO}/attestations"
            echo "o con GitHub CLI: \`gh attestation verify pzlauncher-windows-amd64-gui.exe --repo ${REPO}\`"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/SHA256SUMS.txt
            dist/pzlauncher-windows-amd64-gui.exe
            dist/pzlauncher-linux-amd64
            dist/pzlauncher-darwin-amd64
            dist/pzlauncher-darwin-arm64
            dist/manifest.json
            dist/projectzomboid.jar
          fail_on_unmatched_files: false
